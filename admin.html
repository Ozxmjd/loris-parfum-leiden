<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Loris Parfum Leiden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #ffffff;
    --gold: #c9a45c;
    --gold-light: #e0c896;
    --gray: #6b6b6b;
    --off-white: #f7f5f0;
    --border: #e8e3d8;
    --red: #c0392b;
    --green: #27ae60;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Montserrat', sans-serif; background: var(--off-white); color: var(--black); min-height: 100vh; }

  /* ===== LOGIN ===== */
  #login-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #111 0%, #0a0a0a 100%);
  }
  .login-card {
    background: #161616;
    border: 1px solid #2a2a2a;
    padding: 56px 48px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .login-logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .login-sub {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .login-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--white);
    margin-bottom: 28px;
    font-weight: 400;
  }
  .login-input {
    width: 100%;
    padding: 14px 16px;
    background: #1f1f1f;
    border: 1px solid #333;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color .2s;
    letter-spacing: 2px;
  }
  .login-input:focus { border-color: var(--gold); }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: var(--gold);
    color: var(--black);
    border: none;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s;
  }
  .login-btn:hover { background: var(--gold-light); }
  .login-error {
    margin-top: 14px;
    font-size: 12px;
    color: #e74c3c;
    letter-spacing: 0.5px;
    min-height: 18px;
  }

  /* ===== DASHBOARD ===== */
  #dashboard-section { display: none; }

  .admin-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10,10,10,0.97);
    backdrop-filter: blur(10px);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #222;
  }
  .admin-brand {
    display: flex;
    flex-direction: column;
  }
  .admin-brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .admin-brand-tag {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .logout-btn {
    padding: 8px 20px;
    background: transparent;
    border: 1px solid #444;
    color: #aaa;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s;
  }
  .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ===== TABS ===== */
  .tab-nav {
    background: var(--black);
    display: flex;
    gap: 0;
    border-bottom: 1px solid #222;
    padding: 0 40px;
  }
  .tab-btn {
    padding: 16px 28px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: #666;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--white); }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  .tab-panel { display: none; padding: 40px; max-width: 1100px; margin: 0 auto; }
  .tab-panel.active { display: block; }

  /* ===== PANEL HEADER ===== */
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .panel-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 600;
  }
  .panel-actions { display: flex; gap: 12px; }

  /* ===== BUTTONS ===== */
  .btn {
    padding: 10px 24px;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s;
    border: none;
  }
  .btn-dark { background: var(--black); color: var(--white); border: 1px solid var(--black); }
  .btn-dark:hover { background: #222; }
  .btn-gold { background: var(--gold); color: var(--black); }
  .btn-gold:hover { background: var(--gold-light); }
  .btn-outline { background: transparent; color: var(--black); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--black); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid #e8d8d8; }
  .btn-danger:hover { background: #fff0f0; }
  .btn-sm { padding: 6px 14px; font-size: 10px; letter-spacing: 1.5px; }

  /* ===== TABLE ===== */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--white);
    border: 1px solid var(--border);
  }
  .data-table th {
    padding: 12px 16px;
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
    border-bottom: 1px solid var(--border);
    background: var(--off-white);
  }
  .data-table td {
    padding: 14px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: #fafaf8; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .badge-active { background: #eafaf1; color: var(--green); }
  .badge-inactive { background: #fdf0f0; color: var(--red); }
  .badge-paid { background: #eafaf1; color: var(--green); }

  .price-col { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 15px; }
  .name-col { font-weight: 600; }
  .meta-col { color: var(--gray); font-size: 12px; }

  /* ===== LOADING / EMPTY ===== */
  .state-msg {
    text-align: center;
    padding: 60px 24px;
    color: var(--gray);
    font-size: 13px;
    letter-spacing: 0.5px;
    background: var(--white);
    border: 1px solid var(--border);
  }
  .loading-dots::after {
    content: '...';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%, 20%  { content: '.';   }
    40%      { content: '..';  }
    60%, 100%{ content: '...'; }
  }

  /* ===== FORM ===== */
  .form-card {
    background: var(--white);
    border: 1px solid var(--border);
    padding: 36px 40px;
    max-width: 680px;
  }
  .form-row { margin-bottom: 22px; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 22px; }
  .form-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 8px;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    background: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    color: var(--black);
    outline: none;
    transition: border-color .2s;
    -webkit-appearance: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
  .form-textarea { resize: vertical; min-height: 72px; }
  .form-hint { font-size: 11px; color: var(--gray); margin-top: 5px; }
  .form-section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    margin: 28px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .form-check-row { display: flex; align-items: center; gap: 10px; }
  .form-check-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; }
  .form-check-row label { font-size: 13px; cursor: pointer; }
  .form-feedback {
    margin-top: 16px;
    font-size: 12px;
    padding: 12px 16px;
    border: 1px solid transparent;
  }
  .form-feedback.success { background: #eafaf1; border-color: #a8dfbe; color: #1e8449; }
  .form-feedback.error   { background: #fdf0f0; border-color: #e0a0a0; color: var(--red); }

  /* ===== ORDERS ITEMS ===== */
  .items-list { font-size: 12px; color: var(--gray); line-height: 1.7; }

  @media (max-width: 768px) {
    .admin-header { padding: 14px 20px; }
    .tab-nav { padding: 0 16px; overflow-x: auto; }
    .tab-btn { padding: 14px 18px; white-space: nowrap; }
    .tab-panel { padding: 24px 16px; }
    .form-row-2 { grid-template-columns: 1fr; }
    .form-card { padding: 24px 20px; }
    .data-table { font-size: 12px; }
    .data-table th, .data-table td { padding: 10px 12px; }
  }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<section id="login-section">
  <div class="login-card">
    <div class="login-logo">Loris Parfum</div>
    <div class="login-sub">Leiden — Admin</div>
    <h2>Inloggen</h2>
    <input type="password" id="pw-input" class="login-input" placeholder="Wachtwoord" autocomplete="current-password">
    <button class="login-btn" onclick="login()">Inloggen</button>
    <div class="login-error" id="login-error"></div>
  </div>
</section>

<!-- ===== DASHBOARD ===== -->
<section id="dashboard-section">
  <header class="admin-header">
    <div class="admin-brand">
      <div class="admin-brand-name">Loris Parfum</div>
      <div class="admin-brand-tag">Admin Portal</div>
    </div>
    <button class="logout-btn" onclick="logout()">Uitloggen</button>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('orders')">Bestellingen</button>
    <button class="tab-btn" onclick="switchTab('products')">Producten</button>
    <button class="tab-btn" onclick="switchTab('add-product')">Nieuw Product</button>
  </nav>

  <!-- Tab: Bestellingen -->
  <div class="tab-panel active" id="panel-orders">
    <div class="panel-header">
      <h2 class="panel-title">Bestellingen</h2>
      <div class="panel-actions">
        <button class="btn btn-outline" onclick="loadOrders()">Vernieuwen</button>
      </div>
    </div>
    <div id="orders-content"><div class="state-msg loading-dots">Laden</div></div>
  </div>

  <!-- Tab: Producten -->
  <div class="tab-panel" id="panel-products">
    <div class="panel-header">
      <h2 class="panel-title">Producten</h2>
      <div class="panel-actions">
        <button class="btn btn-outline" onclick="loadProducts()">Vernieuwen</button>
        <button class="btn btn-gold" onclick="switchTab('add-product')">+ Nieuw product</button>
      </div>
    </div>
    <div id="products-content"><div class="state-msg">Klik op de tab om producten te laden.</div></div>
  </div>

  <!-- Tab: Nieuw Product -->
  <div class="tab-panel" id="panel-add-product">
    <div class="panel-header">
      <h2 class="panel-title">Nieuw Product</h2>
    </div>
    <div class="form-card">
      <div class="form-row-2">
        <div>
          <label class="form-label">Naam *</label>
          <input type="text" id="f-name" class="form-input" placeholder="bijv. E138">
        </div>
        <div>
          <label class="form-label">Collectie *</label>
          <select id="f-collection" class="form-select">
            <option value="">— Kies collectie —</option>
            <option>Frequence Mannen</option>
            <option>Frequence Vrouwen</option>
            <option>Frequence Unisex</option>
            <option>Dubai Collectie</option>
            <option>Dubai 100ml</option>
            <option>Niche 50ml</option>
            <option>Mystery Collectie</option>
            <option>DMAR Collectie</option>
            <option>Extract Parfum</option>
            <option>Signature Collectie</option>
            <option>Unisex</option>
          </select>
        </div>
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-label">Prijs (€) *</label>
          <input type="number" id="f-price" class="form-input" placeholder="19.99" step="0.01" min="0">
        </div>
        <div>
          <label class="form-label">Inhoud (ml)</label>
          <select id="f-ml" class="form-select">
            <option value="">— Kies —</option>
            <option value="50">50 ml</option>
            <option value="100">100 ml</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">Afbeelding URL</label>
        <input type="text" id="f-image" class="form-input" placeholder="https://... of relatief pad bijv. images/e138.jpg">
      </div>

      <div class="form-section-title">Geurprofiel</div>
      <div class="form-row">
        <label class="form-label">Top Notes</label>
        <input type="text" id="f-top" class="form-input" placeholder="Bergamot, Citroen, Lavendel">
        <p class="form-hint">Kommagescheiden</p>
      </div>
      <div class="form-row">
        <label class="form-label">Middle Notes</label>
        <input type="text" id="f-mid" class="form-input" placeholder="Roos, Jasmijn, Iris">
        <p class="form-hint">Kommagescheiden</p>
      </div>
      <div class="form-row">
        <label class="form-label">Base Notes</label>
        <input type="text" id="f-base" class="form-input" placeholder="Musk, Amber, Sandelhout">
        <p class="form-hint">Kommagescheiden</p>
      </div>

      <div class="form-row">
        <div class="form-check-row">
          <input type="checkbox" id="f-active" checked>
          <label for="f-active">Direct zichtbaar (actief)</label>
        </div>
      </div>

      <button class="btn btn-dark" style="width:100%;padding:14px;" onclick="submitProduct()">Product Opslaan</button>
      <div id="product-form-feedback"></div>
    </div>
  </div>
</section>

<script>
var API = 'https://ai-review-bot-production.up.railway.app';
var adminKey = '';

// ===== AUTH =====
function login() {
  var pw = document.getElementById('pw-input').value;
  var PASS = 'admin123';
  if (pw === PASS) {
    adminKey = pw;
    sessionStorage.setItem('loris_admin', pw);
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('dashboard-section').style.display = 'block';
    loadOrders();
  } else {
    document.getElementById('login-error').textContent = 'Onjuist wachtwoord.';
  }
}

function logout() {
  sessionStorage.removeItem('loris_admin');
  adminKey = '';
  document.getElementById('dashboard-section').style.display = 'none';
  document.getElementById('login-section').style.display = 'flex';
  document.getElementById('pw-input').value = '';
}

document.getElementById('pw-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') login();
});

(function checkSession() {
  var saved = sessionStorage.getItem('loris_admin');
  if (saved === 'admin123') {
    adminKey = saved;
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('dashboard-section').style.display = 'block';
    loadOrders();
  }
})();

// ===== TABS =====
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  var idx = { orders: 0, products: 1, 'add-product': 2 };
  document.querySelectorAll('.tab-btn')[idx[name]].classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'products') loadProducts();
}

// ===== HELPERS =====
function fmtEur(cents) {
  return '€' + (cents / 100).toFixed(2).replace('.', ',');
}
function fmtDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
         ' ' + d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
}
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== ORDERS =====
function loadOrders() {
  document.getElementById('orders-content').innerHTML = '<div class="state-msg loading-dots">Laden</div>';
  fetch(API + '/api/loris/orders', { headers: { 'X-Admin-Key': adminKey } })
    .then(function(r) { return r.json(); })
    .then(function(orders) { renderOrders(orders); })
    .catch(function(err) {
      document.getElementById('orders-content').innerHTML =
        '<div class="state-msg" style="color:var(--red)">Fout bij laden: ' + escHtml(err.message) + '</div>';
    });
}

function renderOrders(orders) {
  var el = document.getElementById('orders-content');
  if (!orders.length) {
    el.innerHTML = '<div class="state-msg">Nog geen bestellingen.</div>';
    return;
  }
  var rows = orders.map(function(o) {
    var items = (o.items || []).map(function(i) {
      return i.quantity + '\xd7 ' + escHtml(i.name) + ' (' + fmtEur(i.amount_total) + ')';
    }).join('<br>');
    return '<tr>' +
      '<td class="meta-col">' + fmtDate(o.created_at) + '</td>' +
      '<td>' + escHtml(o.customer_email || '—') + '</td>' +
      '<td><div class="items-list">' + (items || '—') + '</div></td>' +
      '<td class="price-col">' + fmtEur(o.amount_total || 0) + '</td>' +
      '<td><span class="badge badge-paid">' + escHtml(o.payment_status || 'paid') + '</span></td>' +
    '</tr>';
  }).join('');
  el.innerHTML =
    '<table class="data-table">' +
      '<thead><tr>' +
        '<th>Datum</th><th>Klant</th><th>Items</th><th>Totaal</th><th>Status</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
}

// ===== PRODUCTS =====
function loadProducts() {
  document.getElementById('products-content').innerHTML = '<div class="state-msg loading-dots">Laden</div>';
  fetch(API + '/api/loris/products', { headers: { 'X-Admin-Key': adminKey } })
    .then(function(r) { return r.json(); })
    .then(function(products) { renderProducts(products); })
    .catch(function(err) {
      document.getElementById('products-content').innerHTML =
        '<div class="state-msg" style="color:var(--red)">Fout bij laden: ' + escHtml(err.message) + '</div>';
    });
}

function renderProducts(products) {
  var el = document.getElementById('products-content');
  if (!products.length) {
    el.innerHTML = '<div class="state-msg">Nog geen producten. <a href="#" onclick="switchTab(\'add-product\');return false;" style="color:var(--gold);">Voeg er een toe.</a></div>';
    return;
  }
  var rows = products.map(function(p) {
    var notes = [].concat(p.top_notes || [], p.middle_notes || [], p.base_notes || []).slice(0, 3).join(', ') || '—';
    return '<tr>' +
      '<td class="name-col">' + escHtml(p.name) + '</td>' +
      '<td class="meta-col">' + escHtml(p.collection) + '</td>' +
      '<td class="price-col">€' + parseFloat(p.price).toFixed(2).replace('.', ',') + '</td>' +
      '<td class="meta-col">' + (p.ml ? p.ml + ' ml' : '—') + '</td>' +
      '<td><div class="items-list">' + escHtml(notes) + '</div></td>' +
      '<td><span class="badge ' + (p.active ? 'badge-active' : 'badge-inactive') + '">' +
        (p.active ? 'Actief' : 'Inactief') + '</span></td>' +
      '<td>' +
        '<button class="btn btn-sm ' + (p.active ? 'btn-danger' : 'btn-outline') + '" ' +
          'onclick="toggleActive(\'' + p.id + '\',' + p.active + ')">' +
          (p.active ? 'Deactiveer' : 'Activeer') +
        '</button>' +
        ' <a href="product.html?id=' + p.id + '" target="_blank" class="btn btn-sm btn-outline" ' +
          'style="text-decoration:none;display:inline-block;">Bekijk</a>' +
      '</td>' +
    '</tr>';
  }).join('');
  el.innerHTML =
    '<table class="data-table">' +
      '<thead><tr>' +
        '<th>Naam</th><th>Collectie</th><th>Prijs</th><th>Inhoud</th>' +
        '<th>Geurprofiel</th><th>Status</th><th>Acties</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
}

function toggleActive(id, currentActive) {
  fetch(API + '/api/loris/products/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
    body: JSON.stringify({ active: !currentActive })
  })
  .then(function(r) { return r.json(); })
  .then(function() { loadProducts(); })
  .catch(function(err) { alert('Fout: ' + err.message); });
}

// ===== ADD PRODUCT =====
function parseNotes(str) {
  if (!str.trim()) return [];
  return str.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
}

function submitProduct() {
  var name = document.getElementById('f-name').value.trim();
  var collection = document.getElementById('f-collection').value;
  var price = document.getElementById('f-price').value;
  var ml = document.getElementById('f-ml').value;
  var image_url = document.getElementById('f-image').value.trim();
  var top_notes = parseNotes(document.getElementById('f-top').value);
  var middle_notes = parseNotes(document.getElementById('f-mid').value);
  var base_notes = parseNotes(document.getElementById('f-base').value);
  var active = document.getElementById('f-active').checked;
  var fb = document.getElementById('product-form-feedback');

  fb.className = 'form-feedback';
  fb.textContent = '';

  if (!name || !collection || !price) {
    fb.className = 'form-feedback error';
    fb.textContent = 'Vul naam, collectie en prijs in.';
    return;
  }

  var payload = { name, collection, price: parseFloat(price), active };
  if (ml) payload.ml = parseInt(ml);
  if (image_url) payload.image_url = image_url;
  if (top_notes.length) payload.top_notes = top_notes;
  if (middle_notes.length) payload.middle_notes = middle_notes;
  if (base_notes.length) payload.base_notes = base_notes;

  fetch(API + '/api/loris/products', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      fb.className = 'form-feedback success';
      fb.textContent = '✓ Product "' + data.product.name + '" opgeslagen!';
      ['f-name','f-price','f-image','f-top','f-mid','f-base'].forEach(function(id) {
        document.getElementById(id).value = '';
      });
      document.getElementById('f-collection').value = '';
      document.getElementById('f-ml').value = '';
      document.getElementById('f-active').checked = true;
    } else {
      throw new Error(data.error || 'Onbekende fout');
    }
  })
  .catch(function(err) {
    fb.className = 'form-feedback error';
    fb.textContent = 'Fout: ' + err.message;
  });
}
</script>
</body>
</html>
